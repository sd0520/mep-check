<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3350">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="機電查驗">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>機電施工查驗</title>
<style>
:root{
  --bg:#f2f5f9;--surface:#fff;--surface-2:#e9eef5;--line:#d3dde8;
  --fg:#172334;--fg-dim:#5b6c82;
  --brand:#2a4465;--brand-ink:#1e3350;--brand-2:#3d6490;--brand-soft:#e4ebf4;
  --ok:#1d7a44;--ok-soft:#e2f3e8;--bad:#c0271f;--bad-soft:#fbe6e4;
  --na:#6b7a8d;--na-soft:#e9edf2;--warn:#9a6300;--warn-soft:#fdf1dc;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;--r:12px;
  --shadow:0 1px 2px rgba(23,35,52,.05),0 2px 10px rgba(23,35,52,.045);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e141c;--surface:#19222e;--surface-2:#212c3a;--line:#2e3d50;
  --fg:#e6ecf4;--fg-dim:#a2b0c2;
  --brand:#7fa8d4;--brand-ink:#16202d;--brand-2:#5b86b8;--brand-soft:#1d2b3d;
  --ok:#5fcf8e;--ok-soft:#14301f;--bad:#ff8a7e;--bad-soft:#331815;
  --na:#9aa8b8;--na-soft:#222c38;--warn:#e8b45c;--warn-soft:#2e2413;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 2px 10px rgba(0,0,0,.25);
  color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;
  line-height:1.6;padding-bottom:5.5rem;-webkit-text-size-adjust:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;line-height:1.3}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
header{position:sticky;top:0;z-index:20;color:#fff;overflow:hidden;
  background:linear-gradient(135deg,var(--brand-ink) 0%,#24395a 55%,var(--brand) 100%);
  padding-top:calc(.6rem + env(safe-area-inset-top,0px));padding-bottom:.6rem;
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 2px 12px rgba(23,35,52,.22)}
header::after{content:"";position:absolute;right:-2.6rem;top:-2.8rem;width:11rem;height:11rem;
  background:url(mark-white.png) no-repeat center/contain;opacity:.1;pointer-events:none}
header .wrap{display:flex;align-items:center;gap:.55rem;position:relative;z-index:1}
header .brand{display:flex;align-items:center;gap:.55rem;min-width:0}
header .brand img{height:19px;width:auto;flex:0 0 auto;display:block}
header .bar{width:1px;height:1.5rem;background:rgba(255,255,255,.3);flex:0 0 auto}
header h1{font-size:.98rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
header .sub{font-size:.7rem;color:#b7c8de;font-family:var(--mono);margin-top:.1rem;
  position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spacer{flex:1 1 auto;min-width:0}
.chipbtn{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.14);
  color:#fff;border-radius:999px;
  padding:.3rem .7rem;font-size:.76rem;cursor:pointer;white-space:nowrap}
main{max-width:72rem;margin:0 auto;padding-block:1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow)}
.sect{font-size:.74rem;font-weight:700;letter-spacing:.09em;color:var(--fg-dim);
  text-transform:uppercase;margin-bottom:.45rem;display:flex;align-items:center;gap:.45rem}
.sect::after{content:"";flex:1;height:1px;background:var(--line)}
.pad{padding:.9rem 1rem}.muted{color:var(--fg-dim)}.tiny{font-size:.78rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
hr.sep{border:0;border-top:1px solid var(--line);margin:1rem 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;
  border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:.55rem .9rem;cursor:pointer;font-size:.9rem;min-height:2.7rem;
  text-decoration:none;color:inherit}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500;
  box-shadow:0 1px 3px rgba(42,68,101,.3)}
@media (prefers-color-scheme:dark){.btn.primary{color:#13202f;font-weight:700}
  .seg button[aria-pressed=true]{color:#13202f;font-weight:700}}
.btn.block{width:100%}.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:.35rem .6rem;min-height:2.2rem;font-size:.8rem}
label.f{display:block;margin-bottom:.85rem}
label.f>span{display:block;font-size:.78rem;color:var(--fg-dim);margin-bottom:.25rem}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--surface);
  border:1px solid var(--line);border-radius:9px;padding:.5rem .6rem;min-height:2.7rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:0 .8rem}
.seg{display:flex;gap:.3rem;flex-wrap:wrap}
.seg button{flex:1 1 5rem;min-width:0;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;padding:.5rem .3rem;cursor:pointer;font-size:.85rem;min-height:2.7rem}
.seg button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.item{border-top:1px solid var(--line);padding:.8rem 0}
.item:first-of-type{border-top:0}
.item h4{font-size:.95rem;font-weight:700;margin-bottom:.1rem}
.std{font-size:.8rem;color:var(--fg-dim);margin-bottom:.45rem}
.std .edit{font-size:.72rem;color:var(--brand);cursor:pointer;margin-left:.3rem;
  background:none;border:0;padding:0;text-decoration:underline}
.chip{display:inline-block;font-size:.68rem;padding:.08rem .45rem;border-radius:5px;
  background:var(--brand-soft);color:var(--brand);margin-right:.35rem;vertical-align:.1em;
  font-weight:700}
.res{display:flex;gap:.3rem;margin-bottom:.45rem}
.res button{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:9px;
  padding:.45rem .2rem;cursor:pointer;font-size:.9rem;min-height:2.7rem}
.res button[aria-pressed=true][data-r=pass]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.res button[aria-pressed=true][data-r=fail]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.res button[aria-pressed=true][data-r=na]{background:var(--na-soft);border-color:var(--na);color:var(--na);font-weight:700}
.shots{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.4rem}
.shot{position:relative;width:4.6rem;height:4.6rem;border-radius:8px;overflow:hidden;
  border:1px solid var(--line);background:var(--surface-2)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot button{position:absolute;top:2px;right:2px;width:1.3rem;height:1.3rem;border-radius:50%;
  border:0;background:rgba(0,0,0,.62);color:#fff;font-size:.8rem;line-height:1;cursor:pointer;padding:0}
.addshot{width:4.6rem;height:4.6rem;border:1px dashed var(--line);border-radius:8px;
  background:var(--surface);cursor:pointer;color:var(--fg-dim);font-size:.72rem;
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -2px 10px rgba(23,35,52,.07)}
.tabbar button{flex:1;border:0;background:none;cursor:pointer;padding:.5rem .3rem .55rem;
  font-size:.76rem;color:var(--fg-dim);display:flex;flex-direction:column;align-items:center;
  gap:.1rem;border-top:2px solid transparent;margin-top:-1px}
.tabbar button[aria-pressed=true]{color:var(--brand);font-weight:700;border-top-color:var(--brand)}
.tabbar .ic{font-size:1.15rem;line-height:1.25}
.rec{display:flex;gap:.7rem;align-items:flex-start;border-top:1px solid var(--line);
  padding:.75rem 0;cursor:pointer}
.rec:first-child{border-top:0}
.pill{display:inline-block;font-size:.7rem;font-weight:700;padding:.1rem .45rem;
  border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.fixed{background:var(--brand-soft);color:var(--brand)}
.pill.draft{background:var(--warn-soft);color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(7rem,1fr));gap:.6rem;margin-bottom:1rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:.6rem .8rem;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.stat.bad::before{background:var(--bad)}.stat.ok::before{background:var(--ok)}
.stat b{display:block;font-size:1.5rem;font-family:var(--mono);line-height:1.2}
.stat span{font-size:.75rem;color:var(--fg-dim)}
.stat.bad b{color:var(--bad)}.stat.ok b{color:var(--ok)}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:42rem;font-size:.82rem}
th,td{border-bottom:1px solid var(--line);padding:.45rem .5rem;text-align:left;vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:.76rem;white-space:nowrap;
  color:var(--fg-dim);letter-spacing:.04em}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty{text-align:center;padding:2.2rem 1rem;color:var(--fg-dim)}
.empty img{width:4.4rem;opacity:.22;margin-bottom:.6rem}
@media (prefers-color-scheme:dark){.empty img{filter:invert(1) brightness(1.6)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:5.2rem;z-index:60;
  background:var(--fg);color:var(--bg);padding:.6rem 1rem;border-radius:999px;
  font-size:.85rem;max-width:88vw;text-align:center}
.banner{border-radius:var(--r);padding:.6rem .8rem;font-size:.85rem;margin-bottom:.9rem;
  background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn)}
dialog{border:0;border-radius:var(--r);padding:0;max-width:min(32rem,92vw);width:100%;
  background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:1.1rem}

/* 列印：只印檢查表 */
#printArea{display:none}
@media print{
  body{background:#fff;color:#000;padding:0}
  header,.tabbar,main{display:none!important}
  #printArea{display:block;font-size:11pt}
  #printArea .phd{display:flex;align-items:flex-end;gap:8pt;
    border-bottom:1.6pt solid #2a4465;padding-bottom:3pt;margin-bottom:6pt}
  #printArea .phd img{height:9mm}
  #printArea .phd .t{flex:1;text-align:center}
  #printArea .phd .t b{font-size:15pt;letter-spacing:.3em}
  #printArea .phd .t div{font-size:7pt;color:#5b6c82;letter-spacing:.08em}
  #printArea .phd .n{font-family:var(--mono);font-size:9pt}
  #printArea table{min-width:0;width:100%;font-size:10pt}
  #printArea th,#printArea td{border:1px solid #000;padding:3pt 4pt}
  #printArea .ph{width:31%;display:inline-block;vertical-align:top;margin:0 1% 6pt 0}
  #printArea .ph img{width:100%;border:1px solid #999}
  @page{size:A4;margin:12mm}
}
</style>
</head>
<body>

<header class="gut">
  <div class="wrap">
    <div class="brand">
      <img src="logo-white.png" alt="IWA" width="59" height="19">
      <div class="bar"></div>
      <h1>機電施工查驗</h1>
    </div>
    <div class="spacer"></div>
    <button class="chipbtn" id="btnSite">✎ 工地</button>
    <button class="chipbtn" id="btnBackup">💾 備份</button>
  </div>
  <div class="sub" id="hdSite">尚未設定工地</div>
</header>

<main class="gut">
  <div id="offTip" class="banner" hidden>離線中：填表、拍照照常，資料存在這支手機裡。</div>

  <!-- 清單 -->
  <section id="vList">
    <button class="btn primary block" id="btnNew" style="margin-bottom:1.1rem">＋ 新增查驗</button>
    <div class="sect">本機查驗紀錄</div>
    <div class="card pad" id="listBox"></div>
  </section>

  <!-- 填表 -->
  <section id="vForm" hidden>
    <div class="row" style="margin-bottom:.8rem">
      <button class="btn sm" id="btnBack">← 返回</button>
      <div class="spacer"></div>
      <span class="tiny mono" id="formCode"></span>
      <button class="btn sm" id="btnPrint">🖨 預覽／列印</button>
      <button class="btn sm primary" id="btnSave">儲存</button>
    </div>
    <div class="card pad" style="margin-bottom:1rem">
      <label class="f"><span>分項工程</span><select id="fSub"></select></label>
      <div class="grid2">
        <label class="f"><span>區域</span><select id="fZone"></select></label>
        <label class="f"><span>樓層</span><select id="fFloor"></select></label>
      </div>
      <label class="f"><span>檢查位置</span>
        <input type="text" id="fLoc" placeholder="例：B1F 電氣室上方橋架"></label>
      <div class="grid2">
        <label class="f"><span>檢查日期</span><input type="date" id="fDate"></label>
        <label class="f"><span>檢查人</span><input type="text" id="fBy" placeholder="姓名"></label>
      </div>
      <label class="f"><span>施工流程</span><div class="seg" id="fStage"></div></label>
      <label class="f" style="margin-bottom:0"><span>抽查時機</span><div class="seg" id="fTiming"></div></label>
    </div>
    <div class="row tiny muted" style="margin-bottom:.4rem">
      結果標記：<span style="color:var(--ok);font-weight:700">○ 合格</span>
      <span style="color:var(--bad);font-weight:700">╳ 缺失</span>
      <span style="color:var(--na)">／ 無此項</span>
      <div class="spacer"></div><span id="progress"></span>
    </div>
    <div class="card pad" id="itemBox"></div>
  </section>

  <!-- 後台 -->
  <section id="vAdmin" hidden>
    <div class="stats" id="stats"></div>
    <div class="card pad" style="margin-bottom:1rem">
      <div class="row">
        <button class="btn" id="btnImport">📥 匯入同仁備份</button>
        <button class="btn" id="exXlsx">⬇ 清查總表</button>
        <button class="btn" id="exFix">⬇ 缺失追蹤表</button>
        <button class="btn" id="exZip">⬇ 照片打包</button>
        <button class="btn" id="exDocx">⬇ 自主檢查表 Word</button>
      </div>
      <p class="tiny muted" style="margin:.6rem 0 0">
        同仁在現場按右上「💾 備份」匯出檔案（LINE 或 Email 傳回），這裡匯入後即可彙整。</p>
    </div>
    <div class="card">
      <div class="tblwrap"><table>
        <thead><tr><th>編號</th><th>日期</th><th>區域樓層</th><th>分項工程</th><th>流程</th>
          <th>位置</th><th>檢查人</th><th>合格</th><th>缺失</th><th>狀態</th><th></th></tr></thead>
        <tbody id="tbody"></tbody></table></div>
      <div class="empty" id="tblEmpty"><img src="mark.png" alt=""><div>還沒有查驗紀錄</div></div>
    </div>
  </section>
</main>

<div id="printArea"></div>

<nav class="tabbar">
  <button id="tabSite" aria-pressed="true"><span class="ic">📋</span>現場</button>
  <button id="tabAdmin" aria-pressed="false"><span class="ic">🗂</span>後台</button>
</nav>

<dialog id="dlgSite"><form method="dialog" class="dlg">
  <h3 style="margin-bottom:.6rem">工地設定</h3>
  <p class="tiny muted" style="margin:0 0 .8rem">會印在每張檢查表的表頭，只存在這支手機。</p>
  <label class="f"><span>工程名稱</span><input type="text" id="sName"></label>
  <label class="f"><span>承攬廠商</span><input type="text" id="sVendor"></label>
  <label class="f"><span>預設檢查人</span><input type="text" id="sBy"></label>
  <div class="row"><button class="btn primary" value="ok">儲存</button>
    <button class="btn" value="cancel">取消</button></div>
</form></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
